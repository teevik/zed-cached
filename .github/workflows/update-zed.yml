name: Update Zed

on:
  schedule:
    - cron: "0 */6 * * *" # Every 6 hours
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest Zed release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            LATEST=$(curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/zed-industries/zed/releases/latest | jq -r '.tag_name')
            if [[ "$LATEST" != "null" && -n "$LATEST" ]]; then
              echo "version=$LATEST" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Attempt $i failed, retrying in 1s..."
            sleep 1
          done
          echo "Failed to get latest release after 3 attempts"
          exit 1

      - name: Check if branch exists
        id: check
        run: |
          if git ls-remote --exit-code --heads origin "zed-${{ steps.latest.outputs.version }}"; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Exit if already processed
        if: steps.check.outputs.exists == 'true' && github.event_name != 'workflow_dispatch'
        run: |
          echo "Branch zed-${{ steps.latest.outputs.version }} already exists, skipping."
          exit 0

      - name: Set should-run output
        id: should_run
        run: |
          if [[ "${{ steps.check.outputs.exists }}" == "false" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi

      - name: Free disk space
        if: steps.should_run.outputs.run == 'true'
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo docker image prune --all --force
          df -h

      - name: Install Nix
        if: steps.should_run.outputs.run == 'true'
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

          # build-dir = /mnt/nix-build
          # sandbox = false

      - name: Make nix build dir
        if: steps.should_run.outputs.run == 'true'
        run: sudo mkdir -p /mnt/nix-build

      - name: Setup Cachix
        if: steps.should_run.outputs.run == 'true'
        uses: cachix/cachix-action@v16
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_TOKEN }}

      - name: Create branch and update flake.lock
        if: steps.should_run.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "zed-${{ steps.latest.outputs.version }}"
          nix flake update zed --override-input zed "github:zed-industries/zed/${{ steps.latest.outputs.version }}"
          git add flake.lock
          git commit -m "Update Zed to ${{ steps.latest.outputs.version }}"

      - name: Build default package
        if: steps.should_run.outputs.run == 'true'
        run: |
          nix build -L .#packages.x86_64-linux.default

      - name: Push branch
        if: steps.should_run.outputs.run == 'true'
        run: |
          git push origin "zed-${{ steps.latest.outputs.version }}" --force

      - name: Update stable branch
        if: steps.should_run.outputs.run == 'true'
        run: |
          git push origin "zed-${{ steps.latest.outputs.version }}:stable" --force
